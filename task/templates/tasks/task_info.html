{% extends "base.html" %}

{% block content %}

<section class="page-title shadow-sm mb-4">
  <h1 id="page-title">Task Info</h1>
  <div class="d-flex gap-2">
    <a href="{% url 'task:task_list' %}" class="btn btn-outline-dark">
      <i class="bi bi-list-ul"></i> List Task
    </a>
  </div>
</section>

<section class="container py-4 px-4"
  style="border: rgba(96, 79, 96, 0.667) 2px solid;
         border-radius: 12px;
         box-shadow: rgb(214, 214, 214) 2px 6px 10px;">

  <div class="row">
    <div class="col-md-12">

      <div class="row">

        <div class="col-md-4">
          <label>Title</label>
          <input type="text" class="form-control" id="title" readonly>
        </div>

        <div class="col-md-4">
          <label>Status</label>
          <input type="text" class="form-control" id="status" readonly>
        </div>

        <div class="col-md-4">
          <label>Due Date</label>
          <input type="text" class="form-control" id="due_date" readonly>
        </div>

        <div class="col-md-12 mt-2">
          <label>Description</label>
          <input type="text" class="form-control" id="description" readonly>
        </div>

      </div>

    </div>
  </div>
</section>

<script>

const TASK_ID = "{{ task_id }}";
const API_KEY = "kdeep@saini@8865@hello";


fetch(`/api/tasks/${TASK_ID}`, {
  headers: {
    "X-API-KEY": API_KEY
  }
})
.then(res => res.json())
.then(result => {
  if (result.status !== "success") {
    alert("Failed to load task");
    return;
  }

  const t = result.data;

  document.getElementById("page-title").innerText = "Task Info - " + t.title;
  document.getElementById("title").value = t.title;
  document.getElementById("status").value = t.status;
  document.getElementById("due_date").value = t.due_date;
  document.getElementById("description").value = t.description;
});
</script>

{% endblock content %}
