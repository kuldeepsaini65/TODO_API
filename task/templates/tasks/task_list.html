{% extends 'base.html' %}

{% block content %}
<section class="page-title shadow-sm mb-4">
  <h1>All Tasks</h1>
  <div class="d-flex gap-2">
    <a href="{% url 'task:task_add' %}" class="btn btn-outline-dark">
      <i class="bi bi-plus-circle"></i> Create Task
    </a>
  </div>
</section>

<section class="container">
  <div class="row">
    <div class="col-md-12">
      <div class="table-responsive">

        <table class="table table-hover table-bordered border-light shadow-sm">
          <thead class="table-dark">
            <tr>
              <th class="text-uppercase py-2 text-center">
                <i class="bi bi-list-task " style="padding: 5px;"></i>Title
              </th>
              <th class=" text-uppercase  py-2 text-center">Description</th>
              <th class=" text-uppercase  py-2 text-center">Date</th>
              <th class=" text-uppercase  py-2 text-center">Status</th>
              <th class=" text-uppercase  py-2 text-center">Action</th>
            </tr>
          </thead>

          <tbody>
            {% for t in tasks %}
            <tr class="">
              <td class="py-1 text-center py-2">
                <div class=" text-dark ">{{ t.title }}</div>
              </td>
              <td class="py-1 text-center py-2">
                <div class="  ">{{ t.description }}</div>
              </td>

              <td class="py-1 text-center py-2">
                <span class="px-3 py-2 ">
                  <i class="bi bi-calendar3 me-2"></i>{{ t.due_date }}
                </span>
              </td>


              <td class="py-2 text-center">
                <span class="badge bg-warning text-dark px-3 py-2 ">
                  {{ t.status }}
                </span>
              </td>
              <td class="py-3 text-center">
                <div class="btn-group btn-group-sm" role="group">

                  <a href="{% url 'task:task_update_view' id=t.id %}" class="btn btn-outline-primary" title="Edit">
                    <i class="bi bi-pencil"></i>
                  </a>

                  <a href="{% url 'task:task_info_view' id=t.id %}" class="btn btn-outline-info" title="View">
                    <i class="bi bi-eye"></i>
                  </a>

                  <a href="{% url 'task:task_delete_view' id=t.id %}" class="btn btn-outline-danger" title="delete">
                    <i class="fa-solid fa-trash"></i>Delete
                  </a>

                </div>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>



      </div>
    </div>

  </div>
</section>

{% endblock content %}
