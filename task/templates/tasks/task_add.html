{% extends "base.html" %}

{% block content %}

<section class="page-title shadow-sm mb-4">
  <h1 id="page-title">Create New Task</h1>

  <div class="d-flex gap-2">
    <a href="{% url 'task:task_list' %}" class="btn btn-outline-dark">
      <i class="bi bi-list-ul"></i> List Task
    </a>
  </div>
</section>

<section class="container py-4 px-4"
  style="border: rgba(96, 79, 96, 0.667) 2px solid;
         border-radius: 12px;
         box-shadow: rgb(214, 214, 214) 2px 6px 10px;">

  <div class="row">
    <div class="col-md-12">

      <!-- IMPORTANT: no method="post" -->
      <form id="taskForm">

        <div class="row">

          <div class="col-md-4">
            <label>Title</label>
            <input
              type="text"
              class="form-control"
              id="title"
              required
            >
          </div>

          <div class="col-md-4">
            <label>Status</label>
            <select id="status" class="form-select" required>
              <option value="PENDING">Pending</option>
              <option value="COMPLETED">Completed</option>
            </select>
          </div>

          <div class="col-md-4">
            <label>Due Date</label>
            <input
              type="date"
              class="form-control"
              id="due_date"
            >
          </div>

          <div class="col-md-12 mt-2">
            <label>Description</label>
            <input
              type="text"
              class="form-control"
              id="description"
            >
          </div>

          <div class="col-md-12 mt-4">
            <button type="submit" class="btn btn-primary" id="submit-btn">
              Create Task
            </button>
          </div>

        </div>
      </form>

    </div>
  </div>
</section>

<script>

const API_KEY = "kdeep@saini@8865@hello";   
const TASK_ID = "{{task_id}}";
console.log(TASK_ID)
/* ================================
   UPDATE MODE → FETCH TASK
================================ */
if (TASK_ID) {
  document.getElementById("page-title").innerText = "Update Task";
  document.getElementById("submit-btn").innerText = "Update Task";

  fetch(`/api/tasks/${TASK_ID}`, {
    headers: {
      "X-API-KEY": API_KEY
    }
  })
  .then(res => res.json())
  .then(result => {
    if (result.status === "success") {
      const t = result.data;
      document.getElementById("title").value = t.title;
      document.getElementById("description").value = t.description;
      document.getElementById("due_date").value = t.due_date;
      document.getElementById("status").value = t.status;
    }
  });
}

/* ================================
   SUBMIT HANDLER
================================ */
document.getElementById("taskForm").addEventListener("submit", function (e) {
  e.preventDefault();

  const payload = {
    title: document.getElementById("title").value,
    description: document.getElementById("description").value,
    due_date: document.getElementById("due_date").value,
    status: document.getElementById("status").value
  };

  let url = "/api/tasks/create/";
  let method = "POST";

  if (TASK_ID) {
    url = `/api/tasks/update/${TASK_ID}`;
    method = "PUT";
  }

  fetch(url, {
    method: method,
    headers: {
      "Content-Type": "application/json",
      "X-API-KEY": API_KEY
    },
    body: JSON.stringify(payload)
  })
  .then(res => res.json())
  .then(result => {
    if (result.status === "success") {
      window.location.href = "{% url 'task:task_list' %}";
    } else {
      alert("Operation failed");
    }
  });
});
</script>

{% endblock content %}
