<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TODO List by Kuldeep</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- Poppins Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">

  <style>
    body{
      background: #f7f7fb;
      min-height: 700px;
      height: 700px;
    }
    * {
      font-family: "Poppins", sans-serif;
      font-weight: 500;
      font-style: normal;
    }

    .navbar {
      box-shadow: 0 2px 6px rgba(0, 0, 0, .04);
    }

    .table {
      box-shadow: black 20px 20px 20px 200px;
    }

    .app-header {
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    box-shadow: 0 2px 6px rgba(0,0,0,.04);
  }
  .brand {
    font-weight: 700;
    font-size: 20px;
    color: #111827;
  }
  .accent{
    color: rgb(255, 118, 26);
  }
   .container-main {
    padding: 48px 20px;
    max-width: 1100px;
    margin: 0 auto;
  }

  /* Page title section that are above list */
  .page-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 18px;
    border-radius: 14px;
    background: #fff;
    border: 1px solid #eef2f7;
  }
  .page-title h1 {
    font-size: 23px;
    margin: 0;
  }

  
  </style>

  {% block style %}{% endblock style %}
</head>

<body>
  <!-- Header -->
  <header class="app-header">
    <nav class="container-fluid">
      <div class="container d-flex align-items-center justify-content-between py-2">
        <div class="brand"> API <span class="accent">TODO</span> </div>
        <div>
          <a href="{% url 'task:task_list' %}" class="btn btn-outline-primary">
            <i class="bi bi-house"></i> Home
          </a>
          <a href="{% url 'task:documentation' %}" class="btn btn-primary">
            <i class="bi bi-file-text"></i> API Docs
          </a>
        </div>
      </div>
    </nav>
  </header>

  <main class="container-main">
    {% block content %}
    {% endblock content %}


    
  {% if messages %}
  <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100;">
    {% for message in messages %}
    <div class="toast align-items-center text-bg-{{ message.tags }} border-0 show slide-alert"
        role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">
          {{ message }}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto"
                data-bs-dismiss="toast"></button>
      </div>
    </div>
    {% endfor %}
  </div>
  {% endif %}

  </main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
    crossorigin="anonymous"></script>

</body>

</html>
